[package]
name = "timelock"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[features]
# Enables the tests that perform a real Wasm executable swap against the registry.
# They embed a compiled fixture, so the Wasm artifacts must be built first:
# `make -C timelock test-upgrade` does both.
wasm-tests = []

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
registry = { path = "../registry" }
